aid: 7chairs
name: Circles - Online Group Support
description: 'Circles (legal entity 7Chairs Ltd, founded 2020 by Irad Eichler and Guy
  Winch) is a consumer digital mental-health company operating an online emotional
  support platform at circlesup.com. It runs live, facilitator-led audio and video
  support groups plus peer chat for people working through narcissistic abuse, toxic
  relationships, breakups, divorce, grief, anxiety and stress, delivered through iOS
  and Android apps and a web app at app.circlesup.com. It is a direct-to-consumer
  subscription service, not a developer platform: as of the 2026-09-05 enrichment pass
  the company publishes no developer portal, no API documentation and no machine-readable
  contract, and its api.circlesup.com host answers every request with an HTTP 503 edge
  page.'
