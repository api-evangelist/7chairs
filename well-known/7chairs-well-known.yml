source: >-
  Live unauthenticated GET of the five named /.well-known/ paths against every host
  this record knows: the registrable domain circlesup.com and its www alias, the web
  app host app.circlesup.com, the API host api.circlesup.com, the Notion-hosted legal
  resources host resources.circlesup.com, and the community host
  expertscommunity.circlesup.com.
note: >-
  NO WellKnown or SecurityTxt pointer is emitted for this provider, and that is a
  deliberate finding rather than an omission. Two distinct false positives were ruled
  out. (1) circlesup.com is WordPress with a catch-all that answers HTTP 200 and an
  HTML page for EVERY unknown path; a control probe of
  https://circlesup.com/aeprobe-bogus-9271/ returned 200 with the same ~141KB shell
  and the generic <title>Circlesup</title>, so each 200 below on that host is a
  soft-404 and not a served document. app.circlesup.com behaves the same way, serving
  its 4,545-byte single-page-app shell for every path. (2) resources.circlesup.com
  DOES serve a real RFC 9116 security.txt at HTTP 200 with text/plain, but it is NOT
  Circles' document: both its Contact and Policy fields resolve to
  https://www.notion.so/Responsible-Disclosure-Policy-5f18bb6b86804eaf989c006131778b9c,
  Notion's own responsible-disclosure policy, and the host is a Notion custom-domain
  site (Notion set-cookie headers, Notion CSP). It is the Notion platform's
  security.txt inherited by every Notion-hosted custom domain, so crediting Circles
  with it would attribute another company's vulnerability-disclosure program to this
  provider. The file is recorded here for provenance and deliberately NOT saved as
  7chairs-security.txt.
